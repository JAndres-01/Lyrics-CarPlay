name: Build LyricsCarPlay iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild -project LyricsCarPlay.xcodeproj \
                     -scheme LyricsCarPlay \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build/ \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Package IPA for Sideloadly
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LyricsCarPlay.app Payload/
          zip -r LyricsCarPlay.ipa Payload

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LyricsCarPlay-IPA
          path: LyricsCarPlay.ipa
